[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-workbench"
version = "0.1.0"
description = "Terminal-first context, agent coordination and outcome workspace"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
tui = ["textual==8.2.8"]
temporal = ["temporalio==1.35.0"]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "textual==8.2.8"]

[project.scripts]
awb = "assistant_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assistant_workbench = ["assets/*.json", "assets/*.md", "assets/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

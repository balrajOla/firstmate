name: Core and installed package
on:
  push:
    branches: [main, codex/assistant-workbench]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e .
      - run: python scripts/build_feature_register.py
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python -m build
      - name: Install the release independently
        run: |
          python -m venv "$RUNNER_TEMP/awb-release"
          "$RUNNER_TEMP/awb-release/bin/python" -m pip install -c requirements-runtime.lock dist/*.whl textual==8.2.8
          AWB_INSTALLED_CLI="$RUNNER_TEMP/awb-release/bin/awb" python -m pytest -q tests/test_installed.py --junitxml=installed-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            test-results.xml
            installed-results.xml
            dist/
  release-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Missing live evidence must fail qualification
        run: |
          set +e
          awb --home "$RUNNER_TEMP/awb-unqualified" qualify --output qualification.json
          result=$?
          set -e
          test "$result" -eq 3
      - uses: actions/upload-artifact@v4
        with:
          name: intentionally-unqualified-release
          path: qualification.json

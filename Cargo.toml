[workspace]
members = ["crates/olympus-core", "crates/olympus-cli", "crates/olympusd"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
strip = true
